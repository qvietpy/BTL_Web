<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Qu?n lý Hóa ??n</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f6f7f8; /* very light gray */
      --card:#ffffff;
      --muted:#6b7280;
      --primary:#0b74e6;
      --success:#16a34a;
      --warning:#f97316;
      --radius:10px;
      --input-padding:11px;
      --shadow: 0 6px 18px rgba(20,20,40,0.06);
      --max-width:1100px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:var(--bg);
      color:#111827;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding:32px;
      display:flex;
      justify-content:center;
    }
    .container{width:100%;max-width:var(--max-width)}
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      margin-bottom:18px;
    }
    .title{
      display:flex;
      align-items:center;
      gap:14px;
    }
    .title .icon{
      width:54px;height:54px;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(180deg,#fff 0%, #f7fafc 100%);
      border-radius:12px;
      box-shadow:var(--shadow);
      font-size:22px;
    }
    h1{font-size:20px;margin:0;font-weight:600}
    .title small{display:block;color:var(--muted);font-weight:400;margin-top:4px;font-size:13px}
    .actions{display:flex;gap:10px;align-items:center}
    .btn{
      border:0;padding:10px 14px;border-radius:10px;color:#fff;font-weight:600;cursor:pointer;
      box-shadow:0 4px 10px rgba(15,23,42,0.06);
      transition:transform .08s ease,opacity .12s;
      font-size:14px;
    }
    .btn:active{transform:translateY(1px)}
    .btn-green{background:var(--success)}
    .btn-blue{background:var(--primary)}
    .btn-orange{background:var(--warning)}
    .card{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:18px;
      overflow:auto;
    }
    table{
      width:100%;
      border-collapse:collapse;
      margin-top:12px;
      font-size:14px;
    }
    thead th{
      text-align:left;
      color:var(--muted);
      font-weight:600;
      padding:12px 10px;
      border-bottom:1px solid #e6e9ee;
    }
    tbody td{padding:12px 10px;border-bottom:1px dashed #eef2f7}
    .empty{
      text-align:center;color:var(--muted);padding:26px 0;font-style:italic;
    }
    /* responsive */
    @media (max-width:800px){
      .topbar{flex-direction:column;align-items:stretch}
      .actions{justify-content:flex-end;flex-wrap:wrap}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="title">
        <div class="icon" aria-hidden="true">
          <!-- notebook icon (SVG) -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="4" y="3" width="14" height="18" rx="2" stroke="#0f172a" stroke-opacity="0.9" stroke-width="1.2"/>
            <path d="M8 7H15" stroke="#0f172a" stroke-opacity="0.9" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M8 11H15" stroke="#0f172a" stroke-opacity="0.9" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <h1>Qu?n lý Hóa ??n</h1>
          <small>Danh sách và thao tác v?i các hóa ??n</small>
        </div>
      </div>

      <div class="actions" role="toolbar" aria-label="Hành ??ng">
        <button class="btn btn-green" onclick="location.href='CreateBill.html'">T?o hóa ??n th? công</button>
        <button class="btn btn-blue">T?o t?t c? tháng này</button>
        <button class="btn btn-orange">G?i hóa ??n</button>
      </div>
    </div>

    <div class="card">
      <table aria-describedby="bills-table">
        <thead>
          <tr>
            <th>Phòng</th>
            <th>Ng??i thuê</th>
            <th>T?ng ti?n</th>
            <th>Tr?ng thái</th>
            <th>Ngày t?o</th>
            <th>Ngày thanh toán</th>
          </tr>
        </thead>
        <tbody id="bills-table-body">
          <!-- Example rows: replace with server-rendered rows -->
          <!-- If there are no bills, show empty row -->
          <tr class="empty-row">
            <td colspan="6" class="empty">Ch?a có hóa ??n.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
